name: lint

on: [push, pull_request]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src

  docker-build:
    runs-on: ubuntu-latest
    needs: ruff
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t tugas1-analisis-big-data:latest .
      - name: Verify image
        run: docker run --rm tugas1-analisis-big-data:latest python -c "import polars, duckdb, plotly; print('OK')"
